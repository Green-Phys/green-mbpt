name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    strategy:
      fail-fast: false

    runs-on: [ self-hosted, ift-vm ]
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openmpi-bin libopenmpi-dev libhdf5-dev libeigen3-dev libopenblas-dev lcov

      - name: Validate agent documentation
        run: python3 scripts/check-agent-docs.py

      - name: Build
        run: |
          mkdir -p build && cd build;
          cmake -DCMAKE_CXX_FLAGS=" --coverage -fno-inline -fno-inline-small-functions -fno-default-inline -fprofile-arcs -ftest-coverage " \
            -DGREEN_RELEASE="origin/main" ..;
          make -j 8;

      - name: Test
        env:
          HDF5_USE_FILE_LOCKING: 'FALSE'
          OMP_NUM_THREADS: 1
        run: |
            cd build;
            ctest -j 1

      - name: Run coverage
        run: |
          cd build;
          lcov --ignore-errors source,source --capture --directory . --output-file coverage.info;
          lcov --ignore-errors unused --remove coverage.info '/usr/*' --output-file coverage.info
          lcov --ignore-errors unused --remove coverage.info '/opt/ohpc/pub/compiler/*' --output-file coverage.info
          lcov --ignore-errors unused --remove coverage.info '*_deps*' --output-file coverage.info
          lcov --ignore-errors unused --remove coverage.info '*libs*' --output-file coverage.info
          lcov --list coverage.info

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          flags: unittests
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
